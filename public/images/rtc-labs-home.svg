  </defs>
  
  <!-- RTC Labs Text -->
  <text x="180" y="28" font-family="Arial, sans-serif" font-size="32" font-weight="bold" text-anchor="middle" fill="url(#logoGradient)">
    RTC Labs
  </text>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="22.5" r="3" fill="#00d4ff" opacity="0.8"/>
  <circle cx="330" cy="22.5" r="3" fill="#00ffff" opacity="0.8"/>
  <rect x="25" y="20" width="10" height="5" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
  <rect x="325" y="20" width="10" height="5" fill="none" stroke="#00ffff" stroke-width="1" opacity="0.6"/>
</svg>
